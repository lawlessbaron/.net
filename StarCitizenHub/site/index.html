<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Verse Atlas</title>
  <meta name="description" content="Verse Atlas: a friendly field guide to Star Citizen. Every mission and mission giver with reputation, every ship with stats and where to buy it, every shop and what it sells, a step-by-step new-player walkthrough, and an interactive fleet viewer.">
  <meta name="theme-color" content="#0d1318">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%230d1318'/%3E%3Cpath d='M16 5l3.5 8.5L28 16l-8.5 3.5L16 27l-3.5-7.5L4 16l8.5-2.5z' fill='%23f0a33a'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Barlow:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>
  <div class="shell">
    <aside class="side" id="side" aria-label="Main navigation">
      <a class="brand" href="#/">
        <svg viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="14" class="brand-ring"/><path d="M16 5l3.5 8.5L28 16l-8.5 3.5L16 27l-3.5-7.5L4 16l8.5-2.5z" class="brand-star"/></svg>
        <span><strong>Verse Atlas</strong><small>Star Citizen field guide</small></span>
      </a>
      <nav id="nav"></nav>
      <div class="side-foot" id="side-foot"></div>
    </aside>
    <div class="main-col">
      <header class="top">
        <button class="icon-btn menu-btn" id="menu-btn" aria-label="Open menu" aria-controls="side" aria-expanded="false"></button>
        <button class="search-trigger" id="search-trigger" aria-label="Search everything">
          <span class="st-icon"></span><span class="st-text">Search missions, ships, weapons, places…</span><kbd>Ctrl K</kbd>
        </button>
        <div class="top-right">
          <span class="chip chip-live" id="version-chip" title="Game version the data was built from">LIVE</span>
          <button class="icon-btn" id="theme-btn" aria-label="Toggle light or dark theme"></button>
        </div>
      </header>
      <main id="main" tabindex="-1"><div class="loading">Loading…</div></main>
      <footer class="foot" id="foot"></footer>
    </div>
  </div>
  <div class="palette" id="palette" hidden>
    <div class="palette-box" role="dialog" aria-modal="true" aria-label="Search">
      <input id="palette-input" type="search" placeholder="Type a mission, ship, weapon, item or place" autocomplete="off" spellcheck="false">
      <div class="palette-results" id="palette-results"></div>
      <div class="palette-hint"><kbd>↑</kbd><kbd>↓</kbd> move · <kbd>Enter</kbd> open · <kbd>Esc</kbd> close</div>
    </div>
  </div>
  <script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
